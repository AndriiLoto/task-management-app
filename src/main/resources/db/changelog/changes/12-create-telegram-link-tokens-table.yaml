databaseChangeLog:
  - changeSet:
      id: create-telegram-link-tokens-table
      author: andrew
      changes:
        - createTable:
            tableName: telegram_link_tokens
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_telegram_link_tokens_user
                    references: users(id)
              - column:
                  name: token
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: expires_at
                  type: datetime
                  constraints:
                    nullable: false
